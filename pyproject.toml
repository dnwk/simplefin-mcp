[project]
name = "simplefin-mcp"
version = "0.1.0"
description = "Read-only SimpleFIN MCP server for goose: bank account balances and transactions via the SimpleFIN protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
simplefin-mcp = "simplefin_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplefin_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
